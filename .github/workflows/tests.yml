name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The version is the same everywhere
        run: |
          engine=$(node -e "const s=require('fs').readFileSync('pyviel.js','utf8');console.log(/VERSION = '([^']+)'/.exec(s)[1])")
          package=$(node -p "require('./package.json').version")
          echo "pyviel.js $engine, package.json $package"
          test "$engine" = "$package"
      - name: Build the course and run the checks
        run: |
          node tools/build-course.js
          git diff --exit-code course.js
          node tools/check-notes.js
          node tools/check-language.js
          node tools/check-translations.js
          node test-errors.js
      - name: The page, in Chrome
        run: node tools/page-test.js
